# From it-env/templates/container-image/release-flows/ (see ../README.md there).
name: refresh release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even if non-Dependabot commits are unreleased
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Anything to release?
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: |
          last=origin/release
          if [ "$FORCE" != true ] && ! git log --format='%an' "$last..HEAD" | grep -q -x 'dependabot\[bot\]'; then
            echo "No Dependabot commits since $last; nothing to refresh."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Unreleased human work = commits not by the bots that change something
          # outside .github/ (CI-only commits don't change what ships).
          unreleased=$(git log --format='%H%x09%an' "$last..HEAD" | while IFS=$'\t' read -r sha author; do
            case "$author" in 'dependabot[bot]'|'github-actions[bot]') continue ;; esac
            git diff-tree --no-commit-id --name-only -r "$sha" | grep -v -q '^\.github/' && echo "$sha"
          done)
          if [ "$FORCE" != true ] && [ -n "$unreleased" ]; then
            echo "::notice::Unreleased non-Dependabot commits since $last; ship them with your next normal release."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        if: steps.guard.outputs.go == 'true'
        run: |
          new=$(python3 - <<'PY'
          import re
          p = 'package.json'; s = open(p).read()
          m = re.search(r'"version": "(\d+)\.(\d+)\.(\d+)"', s)
          new = f'{m[1]}.{m[2]}.{int(m[3]) + 1}'
          open(p, 'w').write(s[:m.start()] + f'"version": "{new}"' + s[m.end():])
          c = open('CHANGELOG.md').read(); i = c.index('\n## [')
          entry = f'\n## [{new}]\n\n### Changed\n\n- Dependency refresh (base image and packages), released automatically.\n'
          open('CHANGELOG.md', 'w').write(c[:i] + entry + c[i:])
          print(new)
          PY
          )
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release($VERSION): dependency refresh"
          git push origin HEAD:"$GITHUB_REF_NAME"
          git push origin HEAD:release
          gh workflow run ci.yaml --ref release
