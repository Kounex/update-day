# Base image + npm packages; patch/digest bumps merge and release themselves
# (dependabot-refresh.yml -> refresh-release.yml). See it-env/templates/container-image/.
version: 2
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Python minor/major and Node major upgrades are deliberate migrations
      # (missing wheels, removed modules, yarn gone from node 25+), not
      # refreshes. Patches and same-tag digests still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      patches:
        update-types: ["patch"]
        patterns: ["*"]
    ignore:
      # Majors of these are a planned migration (Prisma 5 -> 7), not a refresh;
      # see Kounex/it-env templates/container-image/README.md, "Planned migrations".
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # Node's types follow the runtime major (node:22 image); they move with
      # the planned Node 22 -> 24/26 migration, not on their own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
